name: Windows LocalDB
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate ordinary and contained databases
        shell: pwsh
        run: ./Build/Tests/Invoke-LocalDBValidation.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localdb-results
          path: Build/output/LocalDB/
